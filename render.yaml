# Render Blueprint for the API (free plan). Frontend goes to Vercel, database to Supabase.
# Render → New → Blueprint → pick this repo. Values marked `sync: false` are asked for once.
services:
  - type: web
    name: docuextract-api
    runtime: docker
    plan: free # sleeps after ~15 min idle; the frontend shows a "waking up" message
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Origin lock: copy this generated value into Vercel as ORIGIN_SECRET. The API then
      # refuses any request that did not come through Vercel, so it can trust the client IP Vercel puts first in
      # X-Forwarded-For. (Render's proxy rewrites x-real-ip, so that header is not usable here.)
      - key: ORIGIN_SECRET
        generateValue: true
      - key: CLIENT_IP_HEADER
        value: x-forwarded-for
      - key: DATABASE_URL # Supabase → Connect → Session pooler (port 5432)
        sync: false
      - key: APP_URL # your Vercel URL, used in password-reset emails
        sync: false
      - key: CORS_ORIGINS # JSON list, e.g. ["https://your-app.vercel.app"]
        sync: false
      # Optional: without it every extraction uses the free standard reader (text + OCR).
      # Use a key from a project WITHOUT billing so it can never cost money.
      - key: GEMINI_API_KEY
        sync: false
      # Default daily caps on Gemini calls (retries count); the admin panel can change them.
      - key: AI_DAILY_LIMIT_PER_USER
        value: "10"
      - key: AI_DAILY_LIMIT_GLOBAL
        value: "100"
      # Admin panel access: comma-separated emails. The account must sign in with Google or
      # GitHub once (verified email) before the panel opens.
      - key: ADMIN_EMAILS
        sync: false
      # Sign in with Google / GitHub. Callback URLs: <APP_URL>/api/auth/oauth/google/callback
      # and <APP_URL>/api/auth/oauth/github/callback. Empty = button hidden.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Optional SMTP for password reset; without it, reset is disabled in production.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
