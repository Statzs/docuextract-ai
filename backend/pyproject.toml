[project]
name = "docuextract-api"
version = "0.1.0"
description = "DocuExtract AI - document data extraction API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt>=5.0.0",
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "google-genai>=3.5.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pillow>=11",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pypdf>=7.1.1",
    "pypdfium2>=4.30",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]
