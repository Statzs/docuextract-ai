# Alembic CLI config. The app also runs `upgrade head` on startup (app/db.py::init_db),
# so this file is only needed for manual commands, e.g.:
#   uv run alembic revision --autogenerate -m "add column"
#   uv run alembic upgrade head
# The database URL comes from the app settings (DATABASE_URL), never from this file.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
